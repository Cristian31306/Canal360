name: Deploy Canal360 to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /home/cristian/apps/Canal360
            
            # Limpiar cualquier basura temporal que bloquee el pull
            git stash --include-untracked
            
            # Traer últimos cambios de github
            git fetch --all
            git reset --hard origin/main
            
            # Instalar dependencias backend
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # Construir el frontend (Vue/Tailwind)
            npm install
            npm run build
            
            # Limpiar todas las cachés
            php artisan optimize:clear
            
            # Opcional: Reiniciar colas o aplicar migraciones
            # php artisan migrate --force
